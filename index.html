<!DOCTYPE html>
<html lang=pt-BR>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampada</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Lâmpada Interativa com JS</h1>
        <h2>Acione o interruptor para acender a lâmpada!</h2> <!-- Mudado de h1 para h2 -->
    </header>

    <main>
        <div class="lampada">
            <img id="lampada" src="assets/lampada-apagada.png" alt="Lâmpada Apagada" style="cursor: pointer;">
        </div>
        <div class="interruptor">
            <img id="interruptor" src="assets/switch-off.png" alt="Interruptor Desligado" style="cursor: pointer;">
        </div>
        <h3>Não toque na lâmpada!</h3>
    </main>

    <footer>
        <p>&copy; 2026 Desenvolvido por João Silva.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
